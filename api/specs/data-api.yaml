        example: 1746057600.0
        description: Used for consistent pagination. Only events generated before
          this timestamp are fetched.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - latest
          - oldest
        description: Sort order of the events
      - name: from_date
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: 'Filter events from this date. Example: 2024-04-18T05:49:39-06:00'
      - name: to_date
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Filter events to this date
        example: '2024-08-11T23:35:14-06:00'
      - name: created_at_gt
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Filter events emitted after this date
      - name: events
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PageView
            - PageExit
            - PostView
      responses:
        '200':
          description: Successfully retrieved events
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    type: object
                    properties:
                      next_page_uri:
                        type: string
                        nullable: true
                      previous_page_uri:
                        type: string
                        nullable: true
                  events:
                    type: array
                    items:
                      oneOf:
                      - "$ref": "#/components/schemas/PageViewEvent"
                      - "$ref": "#/components/schemas/PageExitEvent"
                      - "$ref": "#/components/schemas/PostViewEvent"
                      discriminator:
                        propertyName: name
                        mapping:
                          PageView: "#/components/schemas/PageViewEvent"
                          PageExit: "#/components/schemas/PageExitEvent"
                          PostView: "#/components/schemas/PostViewEvent"
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Invalid token
        '500':
          description: Internal server error
