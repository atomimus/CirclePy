---
openapi: 3.0.0
info:
  title: Data API
  description: |
    API for fetching events data.

    ## Pagination

    - Every response body is a JSON object containing `events` and `pagination` as top-level keys.
    - The `pagination` key contains `next_page_uri` and `previous_page_uri` if there is a next or previous page, respectively.
    - Use the `next_page_uri` to get the next page of events. This key will be absent if there is no next page.
    - Use the `previous_page_uri` to get the previous page of events. This key will be absent if there is no previous page.
    - Default and max pagination size/`per_page` is 2000.

    ## Fetching incremental updates

    ### First sync

    - Use this to sync all events from the beginning of time.
    - To do this, there is no need to pass any parameters (this returns page 1, 2000 events sorted by latest first).
    - Use the `next_page_uri` to get the next page of events.
    - Do this until you have fetched all the events.
    - Store the max `created_at` timestamp from the events you fetched or the `start_time` of the first sync process (in UTC time or time with timezone info). This will be used in incremental sync in the future.

    ### Incremental sync/new events

    - Pass the `created_at_gt` as a query parameter to get events created after the max `created_at` timestamp from the last sync.
    - Use the `next_page_uri` to get the next page of events.
    - Do this until you have fetched all the events.
    - Store the max `created_at` timestamp from the events you fetched; this will be used in the next incremental sync.

    ## Rate limiting

    - The current rate limit is 600 requests per minute. This allows you to fetch a maximum of 2000 * 600 = 1,200,000 events per minute.
    - Status code 429 will be returned if you exceed the rate limit.

    ## Other parameters

    - For more details on other parameters, refer to the [API documentation](https://app.circle.so/data_api/docs).

    ## Difference between `triggered_at` and `created_at`

    - `triggered_at`: The time when the event was actually triggered in Circle.
    - `created_at`: The time when the event was created in Circle's database. As the process of storing the events is asynchronous, there might be a slight delay between the `triggered_at` and `created_at` timestamps.
    - They will also differ in case we are backfilling events. In this case, the `triggered_at` will be the time when the event was actually triggered, and `created_at` will be the time when the event was created in Circle's database.
    - `created_at` is the timestamp you should use for incremental sync, as `triggered_at` can be in the past in case of backfilling events.
    - We do backfilling when we add a new event type.

    ## Creating an Airbyte source

    [Airbyte](https://airbyte.com/) is an open-source data integration platform that helps you replicate your data in your warehouse. You can create an Airbyte source for Circle data API by following the steps below. We assume you have already set up Airbyte either the cloud version or the self-hosted version.

    - Download the latest YAML file from https://app.circle.so/data_api/docs/airbyte_connector.yaml
    - [Screen recording](https://drive.google.com/file/d/1MLfoovgfImrw1q3HXyHpVO5bUYqIZBpi/view) on how to use the YAML file to create a new data source
  version: V1
servers:
- url: https://app.circle.so
  description: Production server.
paths:
  "/data_api/v1/community_events":
    get:
      summary: Fetch community events data
      description: Retrieve events data based on various query parameters.
      operationId: getCommunityEvents
      security:
      - bearerAuth: []
      parameters:
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        description: Number of events per page
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page number for pagination
      - name: base_timestamp
        in: query
        required: false
        schema:
          type: number
          format: float
        example: 1746057600.0
        description: Used for consistent pagination. Only events generated before
          this timestamp are fetched.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - latest
          - oldest
        description: Sort order of the events
      - name: from_date
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: 'Filter events from this date. Example: 2024-04-18T05:49:39-06:00'
      - name: to_date
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Filter events to this date
        example: '2024-08-11T23:35:14-06:00'
      - name: created_at_gt
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Filter events emitted after this date
      - name: events
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - chat_space.chat_rooms.created
            - chat_space.chat_rooms.message.created
            - community_member.create
            - community_member.destroy
            - community_member.email_changed
            - community_member.joined_community
            - course.lesson.chat_rooms.created
            - course.lesson.chat_rooms.message.created
            - courses.completed
            - courses.lesson.completed
            - courses.section.completed
            - courses.quiz.submitted
            - courses.quiz.failed
            - courses.quiz.passed
            - direct_chat_rooms.created
            - direct_chat_rooms.message.created
            - event.ended
            - event.published
            - event.rsvp
            - group_chat_rooms.created
            - group_chat_rooms.message.created
            - live_event.ended
            - live_stream.chat_rooms.created
            - live_stream.chat_rooms.message.created
            - post.basic.published
            - post.comment.created
            - post.comment.liked
            - post.liked
            - recurring_event.rsvp
            - space_groups.joined
            - space_groups.left
            - spaces.joined
            - spaces.left
            - tagged_member.create
            - tagged_member.destroy
      responses:
        '200':
          description: Successfully retrieved events
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    type: object
                    properties:
                      next_page_uri:
                        type: string
                        nullable: true
                      previous_page_uri:
                        type: string
                        nullable: true
                  events:
                    type: array
                    items:
                      anyOf:
                      - "$ref": "#/components/schemas/chat_space.chat_rooms.created"
                      - "$ref": "#/components/schemas/chat_space.chat_rooms.message.created"
                      - "$ref": "#/components/schemas/community_member.create"
                      - "$ref": "#/components/schemas/community_member.destroy"
                      - "$ref": "#/components/schemas/community_member.email_changed"
                      - "$ref": "#/components/schemas/community_member.joined_community"
                      - "$ref": "#/components/schemas/course.lesson.chat_rooms.created"
                      - "$ref": "#/components/schemas/course.lesson.chat_rooms.message.created"
                      - "$ref": "#/components/schemas/courses.completed"
                      - "$ref": "#/components/schemas/courses.lesson.completed"
                      - "$ref": "#/components/schemas/courses.section.completed"
                      - "$ref": "#/components/schemas/courses.quiz.submitted"
                      - "$ref": "#/components/schemas/courses.quiz.failed"
                      - "$ref": "#/components/schemas/courses.quiz.passed"
                      - "$ref": "#/components/schemas/direct_chat_rooms.created"
                      - "$ref": "#/components/schemas/direct_chat_rooms.message.created"
                      - "$ref": "#/components/schemas/event.ended"
                      - "$ref": "#/components/schemas/event.published"
                      - "$ref": "#/components/schemas/event.rsvp"
                      - "$ref": "#/components/schemas/group_chat_rooms.created"
                      - "$ref": "#/components/schemas/group_chat_rooms.message.created"
                      - "$ref": "#/components/schemas/live_event.ended"
                      - "$ref": "#/components/schemas/live_stream.chat_rooms.created"
                      - "$ref": "#/components/schemas/live_stream.chat_rooms.message.created"
                      - "$ref": "#/components/schemas/post.basic.published"
                      - "$ref": "#/components/schemas/post.comment.created"
                      - "$ref": "#/components/schemas/post.comment.liked"
                      - "$ref": "#/components/schemas/post.liked"
                      - "$ref": "#/components/schemas/recurring_event.rsvp"
                      - "$ref": "#/components/schemas/space_groups.joined"
                      - "$ref": "#/components/schemas/space_groups.left"
                      - "$ref": "#/components/schemas/spaces.joined"
                      - "$ref": "#/components/schemas/spaces.left"
                      - "$ref": "#/components/schemas/tagged_member.create"
                      - "$ref": "#/components/schemas/tagged_member.destroy"
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Invalid token
        '500':
          description: Internal server error
  "/data_api/v1/member_visit_events":
    get:
      summary: Fetch community members visits data (Deprecated)
      deprecated: true
      description: |-
        **Deprecated.** Circle switched to analytics tracker data for visit-based analytics starting August 1, 2025 and stopped populating member visit events in October 2025. Use the `/data_api/v1/analytics_tracker_events` endpoint instead. This endpoint will continue to serve historical data.

        Retrieve community member visits based on various criteria.
      operationId: getMemberVisits
      security:
      - bearerAuth: []
      parameters:
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        description: Number of events per page
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page number for pagination
      - name: base_timestamp
        in: query
        required: false
        schema:
          type: number
          format: float
        example: 1746057600.0
        description: Used for consistent pagination. Only events generated before
          this timestamp are fetched.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - latest
          - oldest
        description: Sort order of the events
      - name: from_date
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: 'Filter events from this date. Example: 2024-04-18T05:49:39-06:00'
      - name: to_date
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Filter events to this date
        example: '2024-08-11T23:35:14-06:00'
      - name: created_at_gt
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Filter events emitted after this date
      responses:
        '200':
          description: Successfully retrieved visits
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    type: object
                    properties:
                      next_page_uri:
                        type: string
                        nullable: true
                      previous_page_uri:
                        type: string
                        nullable: true
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The unique identifier of the visit
                        name:
                          type: string
                          enum:
                          - community_member.visit
                          description: The name of the event
                        triggered_at:
                          type: string
                          format: date-time
                          description: The time the event was triggered
                        created_at:
                          type: string
                          format: date-time
                          description: |-
                            The time at which the event was stored in our DB! Used for only sorting purposes.
                                                    Generally triggered realtime but stored in DB later.
                                                    There will also be a big difference between triggered_at and created at for events that have been back populated.
                        version:
                          type: string
                          description: The version of the event
                        payload:
                          type: object
                          properties:
                            visit:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                  description: The unique identifier of the visit
                                user_agent:
                                  type: string
                                  description: The user agent for the request that
                                    triggered the visit
                                country:
                                  type: string
                                  description: The country of the visitor
                                region:
                                  type: string
                                  description: The region of the visitor
                                city:
                                  type: string
                                  description: The city of the visitor
                                community_member_id:
                                  type: integer
                                  description: The community member id of the visitor
                                user_id:
                                  type: integer
                                  description: The user id of the visitor
                            initiator:
                              "$ref": "#/components/schemas/CommunityMember"
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Invalid token
        '500':
          description: Internal server error
