[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "circlepy"
version = "0.5.1"
description = "Python clients for the Circle.so Admin and Headless APIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Waleed Salah Aldin", email = "waleed9salah@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.34.2,<3",
    "aiohttp>=3.14.5,<4",
    "pillow>=13.0.0,<14",
    "commonmark>=0.9.2,<0.10",
]

[project.optional-dependencies]
dev = [
    "build>=1.6.1,<2",
    "twine>=7.0.0,<8",
    "PyYAML>=6.0.3,<7",
    "pip>=26.2.2,<27",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.1,<2",
    "pytest-socket>=0.8.1,<0.9",
    "coverage>=7.17.0,<8",
    "ruff>=0.17.3,<0.18",
    "mypy>=2.4.0,<3",
    "pip-audit>=2.10.1,<3",
    "types-PyYAML>=6.0.12,<7",
]

[project.urls]
Homepage = "https://github.com/atomimus/CirclePy"
Repository = "https://github.com/atomimus/CirclePy"
Issues = "https://github.com/atomimus/CirclePy/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["circlepy", "circlepy.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --allow-hosts=127.0.0.1,::1 --allow-unix-socket"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["circlepy"]
relative_files = true

[tool.coverage.report]
show_missing = true
# Task 28 owns the 90% branch-coverage release gate. Measure every module now.
exclude_also = []

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Correctness checks across legacy code without a formatting migration.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["tests/http_fixtures.py", "tests/conftest.py", "tools/check_ci.py", "circlepy/transport.py", "circlepy/errors.py", "circlepy/tokens.py", "circlepy/uploads.py", "circlepy/pagination.py"]
strict = true

[[tool.mypy.overrides]]
# Keep the incremental strict boundary for transport, errors, token state and
# the HTTP harness. Facades and dictionary resource methods remain partially typed.
module = ["circlepy", "circlepy.client", "circlepy.async_client", "circlepy.async_auth", "circlepy.async_resources", "circlepy.async_organization", "circlepy.async_learning", "circlepy.async_notifications", "circlepy.api_clients", "circlepy.async_headless_client", "circlepy.headless_client", "circlepy.client_models.*", "circlepy.headless_models.*", "circlepy.admin_v2.*"]
follow_imports = "silent"
