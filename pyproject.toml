[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "circlepy"
version = "0.5.1"
description = "Python clients for the Circle.so Admin and Headless APIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Waleed Salah Aldin", email = "waleed9salah@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.34.2,<3",
    "aiohttp>=3.14.5,<4",
    "pillow>=13.0.0,<14",
    "commonmark>=0.9.2,<0.10",
]

[project.optional-dependencies]
dev = [
    "build>=1.6.1,<2",
    "twine>=7.0.0,<8",
    "PyYAML>=6.0.3,<7",
    "pip>=26.2.2,<27",
]

[project.urls]
Homepage = "https://github.com/atomimus/CirclePy"
Repository = "https://github.com/atomimus/CirclePy"
Issues = "https://github.com/atomimus/CirclePy/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["circlepy", "circlepy.*"]
namespaces = false
