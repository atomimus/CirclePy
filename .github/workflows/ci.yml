name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Read-only validation; never publishes
        type: choice
        required: true
        default: runtime
        options: [runtime, release]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  profile:
    name: profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.select.outputs.profile }}
      source_matrix: ${{ steps.select.outputs.source_matrix }}
      release_artifacts: ${{ steps.select.outputs.release_artifacts }}
      artifact_matrix: ${{ steps.select.outputs.artifact_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - id: select
        name: Select required validation from all changed inputs
        env:
          REQUESTED_PROFILE: ${{ inputs.profile || 'auto' }}
        run: python tools/validation_profiles.py --profile "$REQUESTED_PROFILE" --output validation-profile.json --github-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-profile
          path: validation-profile.json
          if-no-files-found: error
          retention-days: 14

  source:
    name: source (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: profile
    if: needs.profile.outputs.source_matrix == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install constrained development environment
        run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - run: python -m pip check
      - name: Offline regression and HTTP contract tests
        run: python -m coverage run -m pytest -v --junitxml=test-results.xml
      - run: python -m coverage report
      - run: python -m coverage xml
      - run: python -m coverage json -o coverage.json
      - run: python tools/check_branch_coverage.py coverage.json
      - run: python tools/check_fault_matrix.py --junit test-results.xml
      - run: python tools/check_sdk_coverage.py --json > sdk-coverage.json
      - run: python -X utf8 tools/baseline.py
      - run: python -X utf8 tools/published_api.py
      - name: Retain test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python }}
          path: |
            test-results.xml
            coverage.xml
            coverage.json
            sdk-coverage.json
          if-no-files-found: error
          retention-days: 14

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - run: python -m ruff check circlepy tests tools
      - run: python -m ruff check --select E4,E7,E9,F tests/conftest.py tests/http_fixtures.py tests/test_offline_http.py tools/check_ci.py circlepy/transport.py circlepy/errors.py tests/test_transport.py circlepy/tokens.py circlepy/async_auth.py circlepy/async_client.py circlepy/async_resources.py circlepy/api_clients.py circlepy/async_headless_client.py circlepy/headless_models/auth.py tests/test_token_lifecycle.py tests/test_async_admin.py tests/test_client_examples.py
      - run: python -m mypy
      - run: python -m ruff check --select E4,E7,E9,F tools/check_branch_coverage.py tools/check_sdk_coverage.py tools/compare_specs.py tools/check_fault_matrix.py tests/test_sdk_faults.py tests/test_sdk_surface.py tests/test_sdk_reports.py
      - run: python tools/check_sdk_coverage.py
      - run: python tools/check_fault_matrix.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/uploads.py circlepy/rich_text.py circlepy/headless_models/uploads_api.py circlepy/headless_models/helper/tiptap.py tests/test_uploads.py tests/test_rich_text.py tools/check_media_contract.py
      - run: python tools/check_media_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/headless_models/content.py circlepy/headless_models/posts_api.py circlepy/headless_models/comments_api.py circlepy/headless_models/async_content_api.py tests/test_headless_content.py tools/check_content_contract.py
      - run: python tools/check_content_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/headless_models/members.py circlepy/headless_models/community_members_api.py circlepy/headless_models/async_members_api.py circlepy/headless_models/spaces_api.py circlepy/headless_models/space_members_api.py circlepy/headless_models/page_profile_fields_api.py tests/test_headless_members.py tools/check_members_contract.py
      - run: python tools/check_members_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/headless_models/messaging.py circlepy/headless_models/async_messaging_api.py circlepy/headless_models/chat_api.py circlepy/headless_models/notifications_api.py circlepy/headless_models/search_api.py circlepy/headless_models/bookmarks_api.py circlepy/headless_models/cookies_api.py tests/test_headless_messaging.py tools/check_messaging_contract.py
      - run: python tools/check_messaging_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/headless_models/learning.py circlepy/headless_models/async_learning_api.py circlepy/headless_models/courses_api.py circlepy/headless_models/quizzes_api.py circlepy/headless_models/events_api.py circlepy/headless_models/flagged_contents_api.py circlepy/headless_models/invitation_links_api.py circlepy/headless_models/live_streams_api.py tests/test_headless_learning.py tools/check_learning_contract.py tools/check_headless_inventory.py
      - run: python tools/check_learning_contract.py
      - run: python tools/check_headless_inventory.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/pagination.py circlepy/headless_models/pagination.py tests/test_pagination.py tests/test_pagination_examples.py tools/check_pagination_contract.py
      - run: python tools/check_pagination_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/client_models circlepy/async_resources.py tests/test_admin_v1_core.py tests/test_admin_v1_examples.py tools/check_admin_v1_core_contract.py
      - run: python tools/check_admin_v1_core_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/client_models/organization.py circlepy/async_organization.py tests/test_admin_v1_organization.py tests/test_admin_v1_organization_examples.py tools/check_admin_v1_organization_contract.py
      - run: python tools/check_admin_v1_organization_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/client_models/learning.py circlepy/client_models/notifications.py circlepy/async_learning.py circlepy/async_notifications.py tests/test_admin_v1_learning.py tests/test_admin_v1_learning_examples.py tools/check_admin_v1_learning_contract.py
      - run: python tools/check_admin_v1_learning_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/admin_v2 circlepy/api_clients.py tests/test_admin_v2_members.py tests/test_admin_v2_members_examples.py tools/check_admin_v2_members_contract.py
      - run: python tools/check_admin_v2_members_contract.py
      - run: python -m ruff check --select E4,E7,E9,F tests/test_admin_v2_access.py tests/test_admin_v2_access_examples.py tools/check_admin_v2_access_contract.py
      - run: python tools/check_admin_v2_access_contract.py
      - run: python -m ruff check --select E4,E7,E9,F tests/test_admin_v2_content.py tests/test_admin_v2_content_examples.py tests/test_admin_v2_uploads.py tools/check_admin_v2_content_contract.py
      - run: python tools/check_admin_v2_content_contract.py
      - run: python -m ruff check --select E4,E7,E9,F tests/test_admin_v2_courses.py tests/test_admin_v2_courses_examples.py tools/check_admin_v2_courses_contract.py
      - run: python tools/check_admin_v2_courses_contract.py
      - run: python -m ruff check --select E4,E7,E9,F tests/test_admin_v2_events.py tests/test_admin_v2_events_examples.py tools/check_admin_v2_events_contract.py
      - run: python tools/check_admin_v2_events_contract.py
      - run: python -m ruff check --select E4,E7,E9,F tests/test_admin_v2_organization.py tests/test_admin_v2_organization_examples.py tools/check_admin_v2_organization_contract.py
      - run: python tools/check_admin_v2_organization_contract.py
      - run: python -m ruff check --select E4,E7,E9,F tests/test_admin_v2_profiles.py tests/test_admin_v2_profiles_examples.py tools/check_admin_v2_profiles_contract.py
      - run: python tools/check_admin_v2_profiles_contract.py
      - run: python -m ruff check --select E4,E7,E9,F tests/test_admin_v2_operations.py tests/test_admin_v2_operations_examples.py tools/check_admin_v2_operations_contract.py
      - run: python tools/check_admin_v2_operations_contract.py
      - run: python -m ruff check --select E4,E7,E9,F tests/test_admin_v2_billing.py tests/test_admin_v2_billing_examples.py tools/check_admin_v2_billing_contract.py
      - run: python tools/check_admin_v2_billing_contract.py
      - run: python -m ruff check --select E4,E7,E9,F tests/test_admin_v2_paywalls.py tests/test_admin_v2_paywalls_examples.py tools/check_admin_v2_paywalls_contract.py
      - run: python tools/check_admin_v2_paywalls_contract.py
      - run: python tools/check_ci.py --negative-fixture
      - run: python -m ruff check --select E4,E7,E9,F tools/validation_profiles.py tools/publication_guard.py tools/check_distribution.py tools/check_security.py tools/dependency_inventory.py tests/test_validation_profiles.py tests/test_security.py
      - run: python -m ruff check --select E4,E7,E9,F tools/publication_guard.py tests/test_publication.py
      - run: python -m ruff check --select E4,E7,E9,F tools/check_published_release.py tests/test_published_release.py
      - run: python tools/check_security.py
      - run: python -m ruff check --select E4,E7,E9,F tools/sandbox.py tools/sandbox_workflows.py tests/test_sandbox.py
      - run: python tools/dependency_inventory.py docs/dependency-inventory.json
      - run: python -m ruff check --select E4,E7,E9,F tools/check_docs.py examples tests/test_documentation_examples.py
      - run: python tools/check_docs.py --build docs/_build --report docs/_build/verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: docs/_build
          if-no-files-found: error
          retention-days: 14

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Audit pinned runtime and development dependencies
        run: |
          python tools/dependency_inventory.py docs/dependency-inventory.json --audit-requirements dependency-audit-requirements.txt
          python -m pip_audit -r dependency-audit-requirements.txt --no-deps --disable-pip --strict --format json --output dependency-audit.json
          python -m pip_audit -r dependency-audit-requirements.txt --no-deps --disable-pip --strict --format cyclonedx-json --output dependency-sbom.cdx.json
      - name: Retain dependency report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: |
            dependency-audit.json
            dependency-sbom.cdx.json
            dependency-audit-requirements.txt
            docs/dependency-inventory.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: build
    needs: profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Require a fresh output directory outside the tracked dist folder
        run: python tools/publication_guard.py init "${{ runner.temp }}/circlepy-dist"
      - name: Build one retained sdist and wheel from sdist
        run: python -m build --outdir "${{ runner.temp }}/circlepy-dist"
      - run: python -m twine check --strict "${{ runner.temp }}/circlepy-dist/"*
      - name: Inspect archives and bind exact bytes
        run: python tools/check_distribution.py "${{ runner.temp }}/circlepy-dist" --inspect-only --write-hashes "${{ runner.temp }}/circlepy-dist/artifacts.json"
      - name: Bind the pair to source, version, profile and immutable build run
        env:
          VALIDATION_PROFILE: ${{ needs.profile.outputs.profile }}
        run: python tools/publication_guard.py record "${{ runner.temp }}/circlepy-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-distributions
          path: ${{ runner.temp }}/circlepy-dist/
          if-no-files-found: error
          retention-days: 90

  artifact-smoke:
    name: artifact-smoke (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [profile, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profile.outputs.artifact_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ matrix.python }}"
      - run: python -m pip install -c constraints-dev.txt packaging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-distributions
          path: ${{ runner.temp }}/circlepy-dist/
      - name: Clean installed wheel and sdist smokes
        run: python tools/check_distribution.py "${{ runner.temp }}/circlepy-dist" --mode smoke --hashes "${{ runner.temp }}/circlepy-dist/artifacts.json" --report installed-smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installed-smoke-${{ matrix.os }}-${{ matrix.python }}
          path: installed-smoke.json
          if-no-files-found: error
          retention-days: 14

  release-artifacts:
    name: release-artifacts
    needs: [profile, build]
    if: needs.profile.outputs.release_artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -c constraints-dev.txt packaging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-distributions
          path: ${{ runner.temp }}/circlepy-dist/
      - name: Full baseline wheel and sdist rehearsal before publication
        run: python tools/check_distribution.py "${{ runner.temp }}/circlepy-dist" --mode full --hashes "${{ runner.temp }}/circlepy-dist/artifacts.json" --report installed-full.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installed-full
          path: installed-full.json
          if-no-files-found: error
          retention-days: 14

  focused:
    name: focused
    needs: profile
    if: needs.profile.outputs.source_matrix != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Focused guide and validation-tool checks
        run: python -m pytest -v tests/test_validation_profiles.py tests/test_publication.py tests/test_published_release.py tests/test_sandbox.py tests/test_sdk_reports.py tests/*_examples.py --junitxml=focused-tests.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: focused-tests
          path: focused-tests.xml
          if-no-files-found: error
          retention-days: 14

  validation:
    name: validation
    needs: [profile, quality, dependencies, build, source, artifact-smoke, release-artifacts, focused]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validation-profile
          path: .
      - name: Require every selected job and account for unselected jobs
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: python tools/validation_profiles.py --selection validation-profile.json --verify-needs
