name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install constrained development environment
        run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - run: python -m pip check
      - name: Offline regression and HTTP contract tests
        run: python -m coverage run -m pytest -v --junitxml=test-results.xml
      - run: python -m coverage report
      - run: python -m coverage xml
      - run: python -X utf8 tools/baseline.py
      - run: python -X utf8 tools/published_api.py
      - name: Build sdist and wheel from sdist
        run: python -m build
      - run: python -m twine check dist/*
      - name: Inspect and install each artifact outside checkout
        run: python tools/check_distribution.py dist
      - name: Retain test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: error
          retention-days: 14

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - run: python -m ruff check circlepy tests tools
      - run: python -m ruff check --select E4,E7,E9,F tests/conftest.py tests/http_fixtures.py tests/test_offline_http.py tools/check_ci.py circlepy/transport.py circlepy/errors.py tests/test_transport.py circlepy/tokens.py circlepy/async_auth.py circlepy/async_client.py circlepy/async_resources.py circlepy/api_clients.py circlepy/async_headless_client.py circlepy/headless_models/auth.py tests/test_token_lifecycle.py tests/test_async_admin.py tests/test_client_examples.py
      - run: python -m mypy
      - run: python -m ruff check --select E4,E7,E9,F circlepy/uploads.py circlepy/rich_text.py circlepy/headless_models/uploads_api.py circlepy/headless_models/helper/tiptap.py tests/test_uploads.py tests/test_rich_text.py tools/check_media_contract.py
      - run: python tools/check_media_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/headless_models/content.py circlepy/headless_models/posts_api.py circlepy/headless_models/comments_api.py circlepy/headless_models/async_content_api.py tests/test_headless_content.py tools/check_content_contract.py
      - run: python tools/check_content_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/headless_models/members.py circlepy/headless_models/community_members_api.py circlepy/headless_models/async_members_api.py circlepy/headless_models/spaces_api.py circlepy/headless_models/space_members_api.py circlepy/headless_models/page_profile_fields_api.py tests/test_headless_members.py tools/check_members_contract.py
      - run: python tools/check_members_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/headless_models/messaging.py circlepy/headless_models/async_messaging_api.py circlepy/headless_models/chat_api.py circlepy/headless_models/notifications_api.py circlepy/headless_models/search_api.py circlepy/headless_models/bookmarks_api.py circlepy/headless_models/cookies_api.py tests/test_headless_messaging.py tools/check_messaging_contract.py
      - run: python tools/check_messaging_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/headless_models/learning.py circlepy/headless_models/async_learning_api.py circlepy/headless_models/courses_api.py circlepy/headless_models/quizzes_api.py circlepy/headless_models/events_api.py circlepy/headless_models/flagged_contents_api.py circlepy/headless_models/invitation_links_api.py circlepy/headless_models/live_streams_api.py tests/test_headless_learning.py tools/check_learning_contract.py tools/check_headless_inventory.py
      - run: python tools/check_learning_contract.py
      - run: python tools/check_headless_inventory.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/pagination.py circlepy/headless_models/pagination.py tests/test_pagination.py tests/test_pagination_examples.py tools/check_pagination_contract.py
      - run: python tools/check_pagination_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/client_models circlepy/async_resources.py tests/test_admin_v1_core.py tests/test_admin_v1_examples.py tools/check_admin_v1_core_contract.py
      - run: python tools/check_admin_v1_core_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/client_models/organization.py circlepy/async_organization.py tests/test_admin_v1_organization.py tests/test_admin_v1_organization_examples.py tools/check_admin_v1_organization_contract.py
      - run: python tools/check_admin_v1_organization_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/client_models/learning.py circlepy/client_models/notifications.py circlepy/async_learning.py circlepy/async_notifications.py tests/test_admin_v1_learning.py tests/test_admin_v1_learning_examples.py tools/check_admin_v1_learning_contract.py
      - run: python tools/check_admin_v1_learning_contract.py
      - run: python -m ruff check --select E4,E7,E9,F circlepy/admin_v2 circlepy/api_clients.py tests/test_admin_v2_members.py tests/test_admin_v2_members_examples.py tools/check_admin_v2_members_contract.py
      - run: python tools/check_admin_v2_members_contract.py
      - run: python -m ruff check --select E4,E7,E9,F tests/test_admin_v2_access.py tests/test_admin_v2_access_examples.py tools/check_admin_v2_access_contract.py
      - run: python tools/check_admin_v2_access_contract.py
      - run: python -m ruff check --select E4,E7,E9,F tests/test_admin_v2_content.py tests/test_admin_v2_content_examples.py tests/test_admin_v2_uploads.py tools/check_admin_v2_content_contract.py
      - run: python tools/check_admin_v2_content_contract.py
      - run: python -m ruff check --select E4,E7,E9,F tests/test_admin_v2_courses.py tests/test_admin_v2_courses_examples.py tools/check_admin_v2_courses_contract.py
      - run: python tools/check_admin_v2_courses_contract.py
      - run: python tools/check_ci.py --negative-fixture

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Audit pinned runtime and development dependencies
        run: python -m pip_audit -r constraints-dev.txt --no-deps --strict --format json --output dependency-audit.json
      - name: Retain dependency report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 14
