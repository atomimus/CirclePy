# No push, tag, release, workflow_run or validation-profile event can upload.
name: Trusted release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validation never uploads; index modes require approval and Release CI
        type: choice
        required: true
        default: validate
        options: [validate, testpypi, pypi]
      source_sha:
        description: Full current origin/main SHA, also the workflow source
        type: string
        required: true
      ci_run_id:
        description: Successful exact-SHA CI run containing the retained artifacts
        type: string
        required: true
      release_tag:
        description: Existing v1.0.0rcN or v1.0.0 tag; leave empty for validation
        type: string
        required: false

concurrency:
  group: circlepy-package-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RELEASE_MODE: ${{ inputs.mode }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  CI_RUN_ID: ${{ inputs.ci_run_id }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  preflight:
    name: preflight
    if: github.event_name == 'workflow_dispatch' && github.repository == 'atomimus/CirclePy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      evidence_sha256: ${{ steps.verify.outputs.evidence_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - id: verify
        name: Verify main, CI jobs, immutable artifact ZIPs and installed-byte reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publication_guard.py prepare "${{ runner.temp }}/circlepy-release"
      - run: python -m pip install -c constraints-dev.txt packaging
      - name: Inspect the retained distribution contents against this checkout
        run: python tools/check_distribution.py "${{ runner.temp }}/circlepy-release/upload" --inspect-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/circlepy-release/
          if-no-files-found: error
          retention-days: 90

  provenance:
    name: provenance
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This isolated job has no package-index environment or publisher identity.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/circlepy-release/
      - name: Fail hard on any transfer digest mismatch before attestation
        env:
          EXPECTED_EVIDENCE: ${{ needs.preflight.outputs.evidence_sha256 }}
        run: python tools/publication_guard.py verify-transfer "${{ runner.temp }}/circlepy-release"
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          create-storage-record: false
          push-to-registry: false
          subject-path: |
            ${{ runner.temp }}/circlepy-release/upload/*.whl
            ${{ runner.temp }}/circlepy-release/upload/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

  testpypi:
    name: publish-testpypi
    needs: [preflight, provenance]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/circlepy
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Recheck authorization, current main/tag, CI, exact bytes and unused version
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_READY: ${{ vars.PUBLISHER_READY }}
          EXPECTED_EVIDENCE: ${{ needs.preflight.outputs.evidence_sha256 }}
        run: python tools/publication_guard.py prepare .release-publish --authorize
      - name: Upload only the verified pair through TestPyPI OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 verified 2026-10-28
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: .release-publish/upload/
          attestations: true
          verify-metadata: true
          skip-existing: false
          verbose: false
          print-hash: true

  pypi:
    name: publish-pypi
    needs: [preflight, provenance]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/circlepy
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Recheck authorization, current main/tag, CI, exact bytes and unused version
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_READY: ${{ vars.PUBLISHER_READY }}
          EXPECTED_EVIDENCE: ${{ needs.preflight.outputs.evidence_sha256 }}
        run: python tools/publication_guard.py prepare .release-publish --authorize
      - name: Upload only the verified pair through PyPI OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 verified 2026-10-28
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: .release-publish/upload/
          attestations: true
          verify-metadata: true
          skip-existing: false
          verbose: false
          print-hash: true
